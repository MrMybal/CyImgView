# Publie une release quand une étiquette « vX.Y.Z » est poussée :
#   git tag v1.2.0 && git push origin v1.2.0
# L'étiquette doit correspondre à la version de src/version.h.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/docs/package-lock.json

      - name: Installer les outils de documentation
        run: npm --prefix tools/docs ci --no-audit --no-fund

      - name: Vérifier la version
        shell: pwsh
        run: |
          $h = Get-Content src/version.h -Raw
          $v = '{0}.{1}.{2}' -f ([regex]::Match($h,'VERSION_MAJOR (\d+)').Groups[1].Value),
                                ([regex]::Match($h,'VERSION_MINOR (\d+)').Groups[1].Value),
                                ([regex]::Match($h,'VERSION_PATCH (\d+)').Groups[1].Value)
          if ("v$v" -ne "${{ github.ref_name }}") { throw "L'étiquette ${{ github.ref_name }} ne correspond pas à src/version.h (v$v)" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Compiler et empaqueter
        shell: pwsh
        run: ./tools/package.ps1

      - name: Vérifier le manuel local
        run: node --test tools/docs/test.mjs tools/docs/ui.test.mjs

      - name: Vérifier le manuel distribué
        run: python tools/check_package.py

      - name: Publier la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:VERSION.md"
          $noteArgs = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release create "${{ github.ref_name }}" "dist/CyImgView-$env:VERSION-Setup.exe" "dist/CyImgView-$env:VERSION-win64.zip" `
            --title "CyImgView $env:VERSION" @noteArgs
