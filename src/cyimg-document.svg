  <g fill="none" stroke="#edfffa" stroke-width="5.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M62 195H48v23h14M72 195l9 11 9-11M81 206v12M103 195v23M117 218v-23l10 12 10-12v23M169 195h-17v23h17v-10h-7"/>
